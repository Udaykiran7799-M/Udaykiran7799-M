<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="180">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>

    <linearGradient id="giftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="giftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="676" height="176" rx="14" fill="url(#cardBg1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>

  <!-- Left Icon Visual -->
  <g transform="translate(30, 40)">
    <rect width="64" height="64" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <!-- Gift Box Icon -->
    <text x="32" y="42" font-size="28" text-anchor="middle">🎁</text>
  </g>

  <!-- Project Details -->
  <g transform="translate(112, 38)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="130" height="20" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
    <text x="65" y="14" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
      FULL-STACK ECOSYSTEM
    </text>

    <!-- Title -->
    <text x="0" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
      GiftMaker – Online Gift Management
    </text>

    <!-- Description -->
    <text x="0" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">
      Centralized eCommerce platform for customized gifts, surprise planning, cart &amp; wishlist,
    </text>
    <text x="0" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">
      order status tracking, and admin catalog management with full relational data persistence.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 104)">
      <!-- Java Badge -->
      <rect x="0" y="0" width="56" height="20" rx="6" fill="#1E293B" stroke="rgba(234, 45, 46, 0.4)" stroke-width="1"/>
      <text x="28" y="14" fill="#F87171" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Java</text>

      <!-- Spring Boot Badge -->
      <rect x="64" y="0" width="94" height="20" rx="6" fill="#1E293B" stroke="rgba(109, 179, 63, 0.4)" stroke-width="1"/>
      <text x="111" y="14" fill="#4ADE80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Spring Boot</text>

      <!-- MySQL Badge -->
      <rect x="166" y="0" width="65" height="20" rx="6" fill="#1E293B" stroke="rgba(0, 117, 143, 0.4)" stroke-width="1"/>
      <text x="198" y="14" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MySQL</text>

      <!-- JS/HTML/CSS Badge -->
      <rect x="239" y="0" width="110" height="20" rx="6" fill="#1E293B" stroke="rgba(247, 223, 30, 0.4)" stroke-width="1"/>
      <text x="294" y="14" fill="#FDE047" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HTML • CSS • JS</text>
    </g>
  </g>

  <!-- Right Action Pill -->
  <g transform="translate(640, 36)" text-anchor="end">
    <text x="0" y="0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">Explore Repo ↗</text>
  </g>
</svg>
