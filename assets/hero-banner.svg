<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF">
        <animate attributeName="stop-color" values="#00D2FF;#7928CA;#FF0080;#00F5A0;#00D2FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#FF0080;#00F5A0;#00D2FF;#7928CA" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF0080">
        <animate attributeName="stop-color" values="#FF0080;#00F5A0;#00D2FF;#7928CA;#FF0080" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <style>
      .star { animation: twinkle 3s ease-in-out infinite; }
      .float-item { animation: float 4s ease-in-out infinite; }
      .pulse-slow { animation: pulse 3s ease-in-out infinite; }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.2); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56,189,248,0.8)); }
      }
    </style>
  </defs>

  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#grid)"/>

  <!-- Radial Glow Behind Title -->
  <circle cx="450" cy="110" r="180" fill="rgba(99, 102, 241, 0.12)" filter="url(#glow)"/>
  <circle cx="200" cy="130" r="100" fill="rgba(14, 165, 233, 0.08)" filter="url(#glow)"/>
  <circle cx="700" cy="90" r="120" fill="rgba(168, 85, 247, 0.09)" filter="url(#glow)"/>

  <!-- Animated Border Stroke -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Decorative Sparkles / Stars -->
  <g fill="#38BDF8">
    <circle cx="120" cy="50" r="1.5" class="star" style="animation-delay: 0.2s;"/>
    <circle cx="180" cy="180" r="2" class="star" style="animation-delay: 1.1s;"/>
    <circle cx="280" cy="40" r="1.5" class="star" style="animation-delay: 2.3s;"/>
    <circle cx="680" cy="190" r="1.5" class="star" style="animation-delay: 0.7s;"/>
    <circle cx="780" cy="60" r="2" class="star" style="animation-delay: 1.8s;"/>
    <circle cx="820" cy="160" r="1.5" class="star" style="animation-delay: 2.5s;"/>
    <polygon points="740,42 743,48 749,50 743,52 740,58 737,52 731,50 737,48" fill="#C084FC" opacity="0.7" class="star" style="animation-delay: 1.4s;"/>
    <polygon points="150,140 152,145 157,146 152,148 150,153 148,148 143,146 148,145" fill="#38BDF8" opacity="0.6" class="star" style="animation-delay: 0.5s;"/>
  </g>

  <!-- Status Pill Top Center -->
  <g transform="translate(330, 28)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="13" r="7" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      AVAILABLE FOR OPPORTUNITIES
    </text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(450, 105)" text-anchor="middle">
    <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="3" filter="url(#subtleGlow)">
      UDAY KIRAN
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(450, 142)" text-anchor="middle">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="1">
      Full-Stack Developer  <tspan fill="#6366F1">|</tspan>  Java &amp; Spring Boot  <tspan fill="#6366F1">|</tspan>  Aspiring Data Analyst
    </text>
  </g>

  <!-- Tagline Badges / Meta Info -->
  <g transform="translate(450, 185)" text-anchor="middle">
    <!-- College Tag -->
    <g transform="translate(-200, 0)">
      <rect x="-105" y="-12" width="210" height="24" rx="12" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
      <text x="0" y="4" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
        🎓 BCA Data Analytics '27
      </text>
    </g>

    <!-- Experience Tag -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-12" width="210" height="24" rx="12" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(14, 165, 233, 0.3)" stroke-width="1"/>
      <text x="0" y="4" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
        💼 Intern @ BeeSkilled
      </text>
    </g>

    <!-- Location Tag -->
    <g transform="translate(200, 0)">
      <rect x="-95" y="-12" width="190" height="24" rx="12" fill="rgba(236, 72, 153, 0.12)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
      <text x="0" y="4" fill="#FBCFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
        📍 Bengaluru, India
      </text>
    </g>
  </g>

  <!-- Left Code Bracket Accent -->
  <g transform="translate(50, 115)" opacity="0.3" class="float-item">
    <text x="0" y="0" fill="#38BDF8" font-family="monospace" font-size="46" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Right Database / Chart Accent -->
  <g transform="translate(805, 120)" opacity="0.3" class="float-item" style="animation-delay: 2s;">
    <text x="0" y="0" fill="#C084FC" font-family="monospace" font-size="42" font-weight="bold">{ ; }</text>
  </g>
</svg>
