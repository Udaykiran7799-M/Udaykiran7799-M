<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="420">
  <defs>
    <!-- Radial Background -->
    <radialGradient id="celebBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#191333"/>
      <stop offset="50%" stop-color="#0E0C22"/>
      <stop offset="100%" stop-color="#070612"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="rocketGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="burstGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="skinGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5"/>
      <stop offset="100%" stop-color="#EAA882"/>
    </linearGradient>

    <linearGradient id="hairGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D283E"/>
      <stop offset="50%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D1A"/>
    </linearGradient>

    <linearGradient id="hoodieGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <style>
      .rocket-float { animation: rocketPulse 3s ease-in-out infinite; }
      .flame-wiggle { animation: flameBurn 0.3s ease-in-out infinite alternate; }
      .confetti-fall { animation: confettiSpin 4s linear infinite; }
      .star-shine { animation: shineGlow 2.5s ease-in-out infinite; }
      .celebrate-bounce { animation: bodyCheer 2s ease-in-out infinite; }
      .badge-glow { animation: badgePulse 2.5s ease-in-out infinite; }

      @keyframes rocketPulse {
        0%, 100% { transform: translate(460px, 80px) rotate(15deg) translateY(0); }
        50% { transform: translate(460px, 80px) rotate(15deg) translateY(-12px); }
      }
      @keyframes flameBurn {
        0% { transform: scaleY(0.85); }
        100% { transform: scaleY(1.2); }
      }
      @keyframes confettiSpin {
        0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(350px) rotate(720deg); opacity: 0; }
      }
      @keyframes shineGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes bodyCheer {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes badgePulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.8)); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" rx="20" fill="url(#celebBg)"/>

  <!-- Radiant Victory Aura -->
  <circle cx="320" cy="180" r="160" fill="rgba(168, 85, 247, 0.1)" filter="url(#burstGlow)"/>
  <circle cx="480" cy="100" r="100" fill="rgba(56, 189, 248, 0.1)" filter="url(#burstGlow)"/>
  <circle cx="160" cy="120" r="90" fill="rgba(16, 185, 129, 0.08)" filter="url(#burstGlow)"/>

  <!-- ==================== ANIMATED CONFETTI & PARTICLES ==================== -->
  <g>
    <!-- Confetti Streamers -->
    <rect x="120" y="20" width="8" height="14" rx="2" fill="#38BDF8" class="confetti-fall" style="animation-delay: 0.1s;"/>
    <rect x="200" y="40" width="10" height="6" rx="2" fill="#C084FC" class="confetti-fall" style="animation-delay: 1.4s;"/>
    <rect x="280" y="10" width="7" height="12" rx="2" fill="#F472B6" class="confetti-fall" style="animation-delay: 0.8s;"/>
    <rect x="360" y="30" width="9" height="9" rx="2" fill="#34D399" class="confetti-fall" style="animation-delay: 2.1s;"/>
    <rect x="420" y="15" width="8" height="14" rx="2" fill="#FBBF24" class="confetti-fall" style="animation-delay: 1.1s;"/>
    <rect x="520" y="45" width="11" height="7" rx="2" fill="#38BDF8" class="confetti-fall" style="animation-delay: 0.4s;"/>
    <rect x="80" y="60" width="8" height="8" rx="2" fill="#A78BFA" class="confetti-fall" style="animation-delay: 2.7s;"/>
    <rect x="580" y="30" width="7" height="12" rx="2" fill="#F43F5E" class="confetti-fall" style="animation-delay: 1.8s;"/>

    <!-- Gold & Cyan Stars -->
    <polygon points="150,80 153,86 160,88 154,91 151,97 148,91 142,88 148,86" fill="#FBBF24" class="star-shine" style="animation-delay: 0.2s;"/>
    <polygon points="260,60 262,65 268,66 263,68 261,73 259,68 254,66 258,65" fill="#38BDF8" class="star-shine" style="animation-delay: 1.3s;"/>
    <polygon points="410,50 412,54 417,55 412,57 410,61 408,57 403,55 408,54" fill="#C084FC" class="star-shine" style="animation-delay: 2.0s;"/>
    <polygon points="560,90 562,95 568,96 563,98 561,103 559,98 554,96 558,95" fill="#34D399" class="star-shine" style="animation-delay: 0.7s;"/>
  </g>

  <!-- ==================== LAUNCH ROCKET ==================== -->
  <g class="rocket-float" filter="url(#rocketGlow)">
    <!-- Rocket Exhaust Smoke Rings -->
    <circle cx="0" cy="55" r="8" fill="rgba(255, 255, 255, 0.4)" opacity="0.6"/>
    <circle cx="-5" cy="72" r="12" fill="rgba(56, 189, 248, 0.2)" opacity="0.4"/>
    <circle cx="5" cy="90" r="16" fill="rgba(192, 132, 252, 0.15)" opacity="0.2"/>

    <!-- Rocket Thruster Flames -->
    <polygon points="-8,40 8,40 0,65" fill="url(#flameGrad)" class="flame-wiggle"/>
    <polygon points="-5,40 5,40 0,55" fill="#FFFBEB" class="flame-wiggle"/>

    <!-- Rocket Fins -->
    <polygon points="-12,20 -24,38 -10,38" fill="#EC4899"/>
    <polygon points="12,20 24,38 10,38" fill="#EC4899"/>

    <!-- Rocket Body -->
    <path d="M 0,-35 C 16,-10 14,25 10,40 L -10,40 C -14,25 -16,-10 0,-35 Z" fill="url(#rocketGrad)" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Nose Cone -->
    <path d="M 0,-35 C 10,-20 12,-10 12,-5 L -12,-5 C -12,-10 -10,-20 0,-35 Z" fill="#EF4444"/>

    <!-- Porthole Window -->
    <circle cx="0" cy="10" r="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="10" r="5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="-2" cy="8" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- ==================== BUILD SUCCESS BADGE (LEFT) ==================== -->
  <g transform="translate(60, 110)" class="badge-glow">
    <rect width="170" height="74" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5"/>
    <circle cx="28" cy="37" r="14" fill="rgba(16, 185, 129, 0.2)"/>
    <!-- Checkmark Icon -->
    <path d="M 22 37 L 27 42 L 35 32" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Badge Text -->
    <text x="52" y="32" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">
      BUILD SUCCESS
    </text>
    <text x="52" y="48" fill="#34D399" font-family="monospace" font-size="9" font-weight="bold">
      ✓ 100% Tests Passed
    </text>
    <!-- Branch Pill -->
    <rect x="52" y="52" width="70" height="14" rx="4" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="87" y="62" fill="#A5B4FC" font-family="monospace" font-size="7.5" text-anchor="middle">
      main: deployed
    </text>
  </g>

  <!-- ==================== CELEBRATING DEVELOPER CHARACTER ==================== -->
  <g transform="translate(320, 140)" class="celebrate-bounce">
    <!-- Character Torso & Tech Hoodie -->
    <g transform="translate(0, 100)">
      <path d="M -50 40 C -50 0 -35 -20 0 -20 C 35 -20 50 0 50 40 L 45 120 L -45 120 Z" fill="url(#hoodieGrad3)"/>
      
      <!-- Hoodie V-neck -->
      <path d="M -16 -16 L 0 6 L 16 -16 Z" fill="#1E1B4B"/>
      <polygon points="-8,-16 0,-4 8,-16" fill="#38BDF8" opacity="0.8"/>

      <!-- Drawstrings -->
      <line x1="-6" y1="0" x2="-6" y2="18" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="6" y1="0" x2="6" y2="16" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Neck -->
    <rect x="-10" y="60" width="20" height="24" rx="5" fill="#EAA882"/>

    <!-- Left Arm Raised in Victory! -->
    <path d="M -35 85 Q -75 40 -65 -10" fill="none" stroke="#1E1B4B" stroke-width="14" stroke-linecap="round"/>
    <!-- Left Hand Fist / Victory -->
    <circle cx="-63" cy="-14" r="7" fill="#EAA882"/>
    <circle cx="-66" cy="-16" r="3" fill="#D98E68"/>

    <!-- Right Arm Raised in Victory! -->
    <path d="M 35 85 Q 75 40 65 -10" fill="none" stroke="#1E1B4B" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Hand Fist / Peace Sign -->
    <circle cx="63" cy="-14" r="7" fill="#EAA882"/>
    <line x1="61" y1="-21" x2="61" y2="-27" stroke="#EAA882" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="-20" x2="69" y2="-26" stroke="#EAA882" stroke-width="3" stroke-linecap="round"/>

    <!-- Character Head -->
    <g transform="translate(0, 30)">
      <!-- Ears -->
      <circle cx="-28" cy="5" r="8" fill="#EAA882"/>
      <circle cx="28" cy="5" r="8" fill="#EAA882"/>

      <!-- Face -->
      <path d="M -25 -15 C -25 -32 25 -32 25 -15 C 25 12 18 30 0 30 C -18 30 -25 12 -25 -15 Z" fill="url(#skinGrad3)"/>

      <!-- Modern Glasses -->
      <rect x="-21" y="-4" width="18" height="14" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.8"/>
      <rect x="3" y="-4" width="18" height="14" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.8"/>
      <line x1="-3" y1="3" x2="3" y2="3" stroke="#38BDF8" stroke-width="1.8"/>

      <!-- Cheerful Wink or Wide Happy Eyes -->
      <circle cx="-12" cy="3" r="3" fill="#1E1B2E"/>
      <circle cx="-13" cy="2" r="1.2" fill="#FFFFFF"/>
      <circle cx="12" cy="3" r="3" fill="#1E1B2E"/>
      <circle cx="11" cy="2" r="1.2" fill="#FFFFFF"/>

      <!-- Eyebrows raised happily -->
      <path d="M -20 -11 Q -12 -16 -5 -11" fill="none" stroke="#2D283E" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 5 -11 Q 12 -16 20 -11" fill="none" stroke="#2D283E" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M 0 6 Q 1 10 4 9" fill="none" stroke="#D98E68" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Big Radiant Smile -->
      <path d="M -9 15 Q 0 25 9 15 Z" fill="#B85C42"/>
      <path d="M -7 16 Q 0 20 7 16" fill="#FFFFFF"/>

      <!-- Cheeks -->
      <ellipse cx="-16" cy="12" rx="3.5" ry="2" fill="#F87171" opacity="0.45"/>
      <ellipse cx="16" cy="12" rx="3.5" ry="2" fill="#F87171" opacity="0.45"/>

      <!-- Stylish Hair -->
      <path d="M -26 -14 C -26 -35 -12 -44 10 -42 C 22 -40 30 -28 28 -16 C 26 -20 18 -24 10 -23 C 0 -22 -10 -20 -16 -14 Z" fill="url(#hairGrad3)"/>
      <path d="M -24 -20 C -20 -35 5 -42 20 -36 C 14 -32 2 -29 -6 -20 Z" fill="#3D3558" opacity="0.5"/>
    </g>
  </g>

  <!-- ==================== DESKTOP & WORKSTATION (LOWER) ==================== -->
  <g transform="translate(0, 310)">
    <rect x="80" y="0" width="480" height="14" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <line x1="82" y1="2" x2="558" y2="2" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>

    <!-- Terminal Screen on Desk (Lower Center) -->
    <g transform="translate(320, -10)">
      <rect x="-70" y="-35" width="140" height="45" rx="5" fill="#0B0F19" stroke="#334155" stroke-width="1.2"/>
      <!-- Terminal Bar -->
      <rect x="-70" y="-35" width="140" height="8" fill="#1E293B"/>
      <circle cx="-63" cy="-31" r="1.5" fill="#EF4444"/>
      <circle cx="-58" cy="-31" r="1.5" fill="#F59E0B"/>
      <circle cx="-53" cy="-31" r="1.5" fill="#10B981"/>
      <text x="-40" y="-30" fill="#94A3B8" font-family="monospace" font-size="5.5">bash — git push</text>
      <!-- Green command line -->
      <text x="-62" y="-18" fill="#34D399" font-family="monospace" font-size="7">&gt; git push origin main</text>
      <text x="-62" y="-7" fill="#38BDF8" font-family="monospace" font-size="6.5">Everything up-to-date [OK]</text>
    </g>
  </g>

  <!-- Bottom Caption Pill -->
  <g transform="translate(320, 395)" text-anchor="middle">
    <rect x="-155" y="-12" width="310" height="24" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="0" y="4" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      🚀 <tspan fill="#34D399">Mission Accomplished:</tspan> From Concept to Production
    </text>
  </g>
</svg>
