<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="420">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="deskBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#151D33"/>
      <stop offset="60%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="screenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Gradients for Tech Badges -->
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA2D2E"/>
      <stop offset="100%" stop-color="#5382A1"/>
    </linearGradient>

    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>

    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DB33F"/>
      <stop offset="100%" stop-color="#34721D"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00758F"/>
      <stop offset="100%" stop-color="#F29111"/>
    </linearGradient>

    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="100%" stop-color="#D4B800"/>
    </linearGradient>

    <!-- Character Gradients -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5"/>
      <stop offset="100%" stop-color="#EAA882"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D283E"/>
      <stop offset="50%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D1A"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      .float-1 { animation: floatSlow 4s ease-in-out infinite; }
      .float-2 { animation: floatSlow 4.5s ease-in-out 1s infinite; }
      .float-3 { animation: floatSlow 5s ease-in-out 2s infinite; }
      .float-4 { animation: floatSlow 4.2s ease-in-out 1.5s infinite; }
      .float-5 { animation: floatSlow 4.8s ease-in-out 0.5s infinite; }
      
      .twinkle-star { animation: twinkle 3s ease-in-out infinite; }
      .steam-line { animation: riseSteam 3s ease-in-out infinite; stroke-dasharray: 20; stroke-dashoffset: 20; }
      .cursor-blink { animation: blink 1s step-end infinite; }
      .type-line { animation: codePulse 2.5s ease-in-out infinite alternate; }
      .head-bob { animation: subtleBob 3s ease-in-out infinite; }
      .typing-hands { animation: handType 0.6s ease-in-out infinite alternate; }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-9px) rotate(3deg); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      @keyframes riseSteam {
        0% { stroke-dashoffset: 40; opacity: 0; transform: translateY(0); }
        50% { opacity: 0.6; }
        100% { stroke-dashoffset: 0; opacity: 0; transform: translateY(-16px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes codePulse {
        0% { opacity: 0.8; }
        100% { opacity: 1; filter: drop-shadow(0 0 4px #38BDF8); }
      }
      @keyframes subtleBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes handType {
        0% { transform: translateY(0); }
        100% { transform: translateY(-2px); }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="640" height="420" rx="20" fill="url(#deskBg)"/>
  
  <!-- Subtle Ambient Glow Rings -->
  <circle cx="320" cy="200" r="170" fill="rgba(56, 189, 248, 0.06)" filter="url(#screenGlow)"/>
  <circle cx="200" cy="140" r="100" fill="rgba(129, 140, 248, 0.05)" filter="url(#screenGlow)"/>
  <circle cx="450" cy="160" r="110" fill="rgba(192, 132, 252, 0.05)" filter="url(#screenGlow)"/>

  <!-- Twinkling Starlight / Tech Dust -->
  <g fill="#38BDF8">
    <circle cx="80" cy="60" r="1.5" class="twinkle-star" style="animation-delay: 0.1s;"/>
    <circle cx="140" cy="110" r="2" class="twinkle-star" style="animation-delay: 1.2s;"/>
    <circle cx="210" cy="50" r="1.5" class="twinkle-star" style="animation-delay: 2.1s;"/>
    <circle cx="430" cy="45" r="2" class="twinkle-star" style="animation-delay: 0.8s;"/>
    <circle cx="530" cy="85" r="1.5" class="twinkle-star" style="animation-delay: 1.7s;"/>
    <circle cx="580" cy="140" r="2" class="twinkle-star" style="animation-delay: 2.5s;"/>
    <polygon points="105,180 108,185 113,186 108,188 105,193 103,188 98,186 103,185" fill="#C084FC" opacity="0.6" class="twinkle-star" style="animation-delay: 0.6s;"/>
    <polygon points="510,180 512,184 517,185 512,187 510,191 508,187 503,185 508,184" fill="#38BDF8" opacity="0.6" class="twinkle-star" style="animation-delay: 1.9s;"/>
  </g>

  <!-- ==================== FLOATING TECH ICONS ==================== -->
  
  <!-- Java Icon (Left) -->
  <g transform="translate(65, 120)" class="float-1" filter="url(#iconShadow)">
    <rect width="46" height="46" rx="12" fill="#1E293B" stroke="rgba(234, 45, 46, 0.4)" stroke-width="1.5"/>
    <!-- Java stylized cup & steam -->
    <path d="M 23 15 Q 21 18 24 20 Q 27 22 23 25" fill="none" stroke="#EA2D2E" stroke-width="2" stroke-linecap="round"/>
    <path d="M 28 15 Q 26 18 29 20" fill="none" stroke="#5382A1" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 16 26 L 30 26 C 30 33 26 35 23 35 C 20 35 16 33 16 26 Z" fill="url(#javaGrad)"/>
    <path d="M 30 27 Q 34 27 34 30 Q 34 32 30 32" fill="none" stroke="#EA2D2E" stroke-width="1.8"/>
    <path d="M 14 36 Q 23 38 32 36" fill="none" stroke="#5382A1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Python Icon (Top Left) -->
  <g transform="translate(140, 45)" class="float-2" filter="url(#iconShadow)">
    <rect width="44" height="44" rx="12" fill="#1E293B" stroke="rgba(55, 118, 171, 0.4)" stroke-width="1.5"/>
    <path d="M 22 13 C 17 13 16 15 16 17 L 16 20 L 23 20 L 23 21 L 14 21 C 12 21 10 23 10 27 C 10 30 12 32 15 32 L 17 32 L 17 30 C 17 28 19 26 21 26 L 27 26 C 29 26 31 24 31 22 L 31 17 C 31 15 29 13 25 13 L 22 13 Z" fill="#3776AB"/>
    <circle cx="19" cy="16" r="1" fill="#FFFFFF"/>
    <path d="M 22 35 C 27 35 28 33 28 31 L 28 28 L 21 28 L 21 27 L 30 27 C 32 27 34 25 34 21 C 34 18 32 16 29 16 L 27 16 L 27 18 C 27 20 25 22 23 22 L 17 22 C 15 22 13 24 13 26 L 13 31 C 13 33 15 35 19 35 L 22 35 Z" fill="#FFD43B"/>
    <circle cx="25" cy="32" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Spring Boot Icon (Top Right) -->
  <g transform="translate(460, 45)" class="float-3" filter="url(#iconShadow)">
    <rect width="44" height="44" rx="12" fill="#1E293B" stroke="rgba(109, 179, 63, 0.4)" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="14" fill="rgba(109, 179, 63, 0.15)"/>
    <!-- Spring Leaf -->
    <path d="M 15 27 C 14 20 18 14 28 13 C 29 22 25 29 15 27 Z" fill="url(#springGrad)"/>
    <path d="M 15 27 Q 22 23 28 13" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Database / SQL Icon (Right) -->
  <g transform="translate(535, 125)" class="float-4" filter="url(#iconShadow)">
    <rect width="46" height="46" rx="12" fill="#1E293B" stroke="rgba(0, 117, 143, 0.4)" stroke-width="1.5"/>
    <ellipse cx="23" cy="16" rx="12" ry="4" fill="url(#dbGrad)"/>
    <path d="M 11 16 L 11 23 C 11 25.5 16 27 23 27 C 30 27 35 25.5 35 23 L 35 16" fill="none" stroke="#00D2FF" stroke-width="1.8"/>
    <path d="M 11 23 L 11 30 C 11 32.5 16 34 23 34 C 30 34 35 32.5 35 30 L 35 23" fill="none" stroke="#00D2FF" stroke-width="1.8"/>
  </g>

  <!-- JavaScript Icon (Floating Upper Center-Left) -->
  <g transform="translate(260, 30)" class="float-5" filter="url(#iconShadow)">
    <rect width="36" height="36" rx="8" fill="#F7DF1E"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">JS</text>
  </g>

  <!-- ==================== DEVELOPER SEAT & DESK ==================== -->
  
  <!-- Chair Backrest -->
  <g transform="translate(320, 210)">
    <rect x="-55" y="-100" width="110" height="130" rx="30" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <!-- Headrest -->
    <rect x="-35" y="-135" width="70" height="30" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <path d="M -40 -30 Q 0 -20 40 -30" stroke="#6366F1" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- Chair Lumbar Accent -->
    <circle cx="0" cy="-60" r="16" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Character Group with subtle head bob -->
  <g class="head-bob">
    <!-- Character Body / Tech Hoodie -->
    <g transform="translate(320, 240)">
      <!-- Shoulders & Torso -->
      <path d="M -70 40 C -70 0 -45 -20 0 -20 C 45 -20 70 0 70 40 L 65 80 L -65 80 Z" fill="url(#hoodieGrad)"/>
      
      <!-- Hoodie Collar / V-neck -->
      <path d="M -22 -15 L 0 15 L 22 -15 Z" fill="#1E1B4B"/>
      <!-- Inner shirt -->
      <polygon points="-12,-15 0,2 12,-15" fill="#38BDF8" opacity="0.8"/>
      
      <!-- Hoodie Drawstrings -->
      <line x1="-8" y1="5" x2="-8" y2="28" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-8" cy="30" r="2" fill="#38BDF8"/>
      <line x1="8" y1="5" x2="8" y2="26" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="8" cy="28" r="2" fill="#38BDF8"/>

      <!-- Tech Emblem on Chest -->
      <circle cx="35" cy="15" r="7" fill="rgba(56, 189, 248, 0.15)"/>
      <polygon points="35,11 38,17 32,17" fill="#38BDF8"/>
    </g>

    <!-- Character Neck -->
    <rect x="308" y="205" width="24" height="24" rx="6" fill="#EAA882"/>

    <!-- Character Head -->
    <g transform="translate(320, 175)">
      <!-- Ears -->
      <circle cx="-32" cy="5" r="9" fill="#EAA882"/>
      <circle cx="-32" cy="5" r="5" fill="#D98E68"/>
      <circle cx="32" cy="5" r="9" fill="#EAA882"/>
      <circle cx="32" cy="5" r="5" fill="#D98E68"/>

      <!-- Face Base -->
      <path d="M -28 -15 C -28 -35 28 -35 28 -15 C 28 15 22 35 0 35 C -22 35 -28 15 -28 -15 Z" fill="url(#skinGrad)"/>

      <!-- Modern Glasses (Neon Tech Hue) -->
      <rect x="-24" y="-3" width="20" height="15" rx="5" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="2"/>
      <rect x="4" y="-3" width="20" height="15" rx="5" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="2"/>
      <line x1="-4" y1="4" x2="4" y2="4" stroke="#38BDF8" stroke-width="2"/>
      <line x1="-24" y1="4" x2="-32" y2="2" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="24" y1="4" x2="32" y2="2" stroke="#38BDF8" stroke-width="1.5"/>

      <!-- Eyes & Highlights -->
      <circle cx="-14" cy="4" r="3.5" fill="#1E1B2E"/>
      <circle cx="-15" cy="3" r="1.2" fill="#FFFFFF"/>
      <circle cx="14" cy="4" r="3.5" fill="#1E1B2E"/>
      <circle cx="13" cy="3" r="1.2" fill="#FFFFFF"/>

      <!-- Eyebrows -->
      <path d="M -23 -8 Q -14 -12 -6 -8" fill="none" stroke="#2D283E" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 6 -8 Q 14 -12 23 -8" fill="none" stroke="#2D283E" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M -1 8 Q 0 13 4 12" fill="none" stroke="#D98E68" stroke-width="2" stroke-linecap="round"/>

      <!-- Friendly Smile -->
      <path d="M -8 18 Q 0 25 8 18" fill="none" stroke="#B85C42" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Cheeks Blush -->
      <ellipse cx="-19" cy="14" rx="4" ry="2" fill="#F87171" opacity="0.4"/>
      <ellipse cx="19" cy="14" rx="4" ry="2" fill="#F87171" opacity="0.4"/>

      <!-- Stylish Hair (Dark textured quiff) -->
      <path d="M -30 -15 C -30 -38 -15 -48 10 -46 C 25 -44 34 -32 32 -18 C 30 -22 22 -26 12 -25 C 2 -24 -10 -22 -18 -15 C -24 -9 -28 -12 -30 -15 Z" fill="url(#hairGrad)"/>
      <path d="M -28 -20 C -25 -38 5 -46 22 -40 C 15 -35 2 -32 -8 -22 Z" fill="#3D3558" opacity="0.5"/>
    </g>
  </g>

  <!-- ==================== DESKTOP & WORKSPACE ==================== -->
  
  <!-- Desk Surface -->
  <g transform="translate(0, 310)">
    <!-- Desk Top Platform -->
    <rect x="40" y="0" width="560" height="18" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <line x1="42" y1="2" x2="598" y2="2" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
    <!-- Desk Legs / Stand -->
    <rect x="70" y="18" width="16" height="92" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <rect x="554" y="18" width="16" height="92" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <!-- Under-desk ambient neon light -->
    <line x1="80" y1="20" x2="560" y2="20" stroke="#6366F1" stroke-width="3" filter="url(#softGlow)" opacity="0.4"/>
  </g>

  <!-- Typing Arms & Hands (positioned over desk) -->
  <g class="typing-hands">
    <!-- Left Forearm & Hand -->
    <path d="M 260 275 L 290 305 L 305 305" fill="none" stroke="#1E1B4B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="305" cy="305" r="7" fill="#EAA882"/>
    <!-- Right Forearm & Hand -->
    <path d="M 380 275 L 350 305 L 335 305" fill="none" stroke="#1E1B4B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="335" cy="305" r="7" fill="#EAA882"/>
  </g>

  <!-- Sleek Modern Laptop with Glowing Screen -->
  <g transform="translate(320, 280)">
    <!-- Laptop Base / Keyboard -->
    <ellipse cx="0" cy="32" rx="68" ry="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Trackpad -->
    <rect x="-14" y="28" width="28" height="8" rx="2" fill="#334155"/>
    
    <!-- Laptop Screen Glow Cone -->
    <polygon points="-58,-22 58,-22 80,28 -80,28" fill="rgba(56, 189, 248, 0.08)" filter="url(#screenGlow)"/>

    <!-- Laptop Lid / Screen Bezel -->
    <rect x="-62" y="-24" width="124" height="52" rx="4" fill="url(#laptopGrad)" stroke="#64748B" stroke-width="1.5"/>
    <!-- Inner Screen Display (IDE Code Window) -->
    <rect x="-58" y="-20" width="116" height="44" rx="2" fill="#0B0F19"/>
    
    <!-- Code Window Titlebar -->
    <rect x="-58" y="-20" width="116" height="7" fill="#1E293B"/>
    <circle cx="-53" cy="-16.5" r="1.5" fill="#EF4444"/>
    <circle cx="-48" cy="-16.5" r="1.5" fill="#F59E0B"/>
    <circle cx="-43" cy="-16.5" r="1.5" fill="#10B981"/>

    <!-- Glowing Code Lines -->
    <g class="type-line">
      <line x1="-52" y1="-8" x2="-20" y2="-8" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
      <line x1="-16" y1="-8" x2="10" y2="-8" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <line x1="-52" y1="-2" x2="-35" y2="-2" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="-2" x2="25" y2="-2" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      <line x1="-46" y1="4" x2="-10" y2="4" stroke="#F472B6" stroke-width="2" stroke-linecap="round"/>
      <line x1="-6" y1="4" x2="30" y2="4" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <line x1="-52" y1="10" x2="-25" y2="10" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <!-- Blinking Cursor -->
      <line x1="-20" y1="8" x2="-20" y2="12" stroke="#38BDF8" stroke-width="2" class="cursor-blink"/>
    </g>

    <!-- Laptop Apple/Tech Back Glow Symbol (reflected) -->
    <circle cx="0" cy="2" r="3" fill="#38BDF8" filter="url(#softGlow)" opacity="0.6"/>
  </g>

  <!-- Glowing Coffee Mug (Desk Right) -->
  <g transform="translate(470, 280)">
    <rect x="0" y="10" width="22" height="22" rx="4" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <!-- Mug Handle -->
    <path d="M 22 14 C 27 14 27 24 22 24" fill="none" stroke="#6366F1" stroke-width="2"/>
    <!-- Mug Tech Decal -->
    <text x="11" y="24" fill="#38BDF8" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    <!-- Animated Steam -->
    <path d="M 6 8 Q 8 2 6 -3" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" class="steam-line"/>
    <path d="M 12 7 Q 15 1 13 -5" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" class="steam-line" style="animation-delay: 1s;"/>
    <path d="M 17 8 Q 15 3 18 -2" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" class="steam-line" style="animation-delay: 2s;"/>
  </g>

  <!-- Desk Succulent Plant (Desk Left) -->
  <g transform="translate(130, 282)">
    <!-- Pot -->
    <polygon points="4,20 18,20 20,30 2,30" fill="#334155" stroke="#475569" stroke-width="1"/>
    <!-- Leaves -->
    <path d="M 11 20 Q 5 10 11 4 Q 17 10 11 20" fill="#10B981"/>
    <path d="M 8 20 Q 0 14 5 10" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <path d="M 14 20 Q 22 14 17 10" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Caption Pill -->
  <g transform="translate(320, 395)" text-anchor="middle">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="0" y="4" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      ⚡ <tspan fill="#38BDF8">Crafting Clean Code</tspan> &amp; <tspan fill="#C084FC">Scalable Architectures</tspan>
    </text>
  </g>
</svg>
