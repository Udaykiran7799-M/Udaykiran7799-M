<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDiv" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <line x1="40" y1="12" x2="760" y2="12" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#glowDiv)"/>
  
  <!-- Center Diamond Star -->
  <g transform="translate(400, 12)">
    <polygon points="0,-7 4,-2 9,0 4,2 0,7 -4,2 -9,0 -4,-2" fill="#818CF8">
      <animate attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
</svg>
