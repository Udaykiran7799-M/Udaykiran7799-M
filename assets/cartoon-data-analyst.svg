<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="420">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="analystBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111B33"/>
      <stop offset="60%" stop-color="#090E1D"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="dataGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="chartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.0)"/>
    </linearGradient>

    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5"/>
      <stop offset="100%" stop-color="#EAA882"/>
    </linearGradient>

    <linearGradient id="hairGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D283E"/>
      <stop offset="50%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D1A"/>
    </linearGradient>

    <linearGradient id="hoodieGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <style>
      .pulse-chart { animation: barGrow 3s ease-in-out infinite alternate; }
      .float-analytics { animation: floatBox 4.5s ease-in-out infinite; }
      .rotate-donut { animation: spinDonut 20s linear infinite; transform-origin: 470px 150px; }
      .twinkle-p { animation: starPulse 2.8s ease-in-out infinite; }
      .pulse-dot { animation: dotPing 1.8s ease-in-out infinite; }

      @keyframes barGrow {
        0% { transform: scaleY(0.92); }
        100% { transform: scaleY(1.05); }
      }
      @keyframes floatBox {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes starPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes dotPing {
        0% { r: 3; opacity: 1; }
        50% { r: 6; opacity: 0.4; }
        100% { r: 3; opacity: 1; }
      }
      @keyframes spinDonut {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" rx="20" fill="url(#analystBg)"/>

  <!-- Ambient Light Wells -->
  <circle cx="200" cy="220" r="150" fill="rgba(14, 165, 233, 0.08)" filter="url(#dataGlow)"/>
  <circle cx="480" cy="160" r="140" fill="rgba(168, 85, 247, 0.08)" filter="url(#dataGlow)"/>

  <!-- Twinkling Data Points / Starlight -->
  <g fill="#38BDF8">
    <circle cx="70" cy="80" r="1.5" class="twinkle-p" style="animation-delay: 0.3s;"/>
    <circle cx="160" cy="40" r="2" class="twinkle-p" style="animation-delay: 1.5s;"/>
    <circle cx="280" cy="65" r="1.5" class="twinkle-p" style="animation-delay: 2.2s;"/>
    <circle cx="560" cy="50" r="2" class="twinkle-p" style="animation-delay: 0.7s;"/>
    <circle cx="590" cy="220" r="1.5" class="twinkle-p" style="animation-delay: 1.9s;"/>
    <polygon points="100,160 102,164 107,165 102,167 100,171 98,167 93,165 98,164" fill="#C084FC" opacity="0.6" class="twinkle-p" style="animation-delay: 1.1s;"/>
  </g>

  <!-- ==================== HOLOGRAPHIC ANALYTICS DASHBOARD ==================== -->

  <!-- Main Chart Glass Board (Right / Background) -->
  <g transform="translate(320, 50)" class="float-analytics" filter="url(#chartShadow)">
    <!-- Glass Panel -->
    <rect width="280" height="190" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <rect width="280" height="28" rx="16" fill="rgba(30, 41, 59, 0.8)"/>
    <circle cx="18" cy="14" r="3" fill="#EF4444"/>
    <circle cx="28" cy="14" r="3" fill="#F59E0B"/>
    <circle cx="38" cy="14" r="3" fill="#10B981"/>
    <text x="60" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">
      DATA INSIGHTS &amp; METRICS
    </text>
    <rect x="215" y="6" width="52" height="16" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="0.8"/>
    <text x="241" y="18" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">
      +98.4%
    </text>

    <!-- Grid Lines -->
    <line x1="20" y1="65" x2="260" y2="65" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3,3"/>
    <line x1="20" y1="105" x2="260" y2="105" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3,3"/>
    <line x1="20" y1="145" x2="260" y2="145" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3,3"/>

    <!-- Dynamic Bar Charts -->
    <g transform="translate(30, 165)">
      <!-- Bar 1 -->
      <g style="transform-origin: 10px 0px;" class="pulse-chart">
        <rect x="0" y="-40" width="16" height="40" rx="3" fill="url(#barGrad1)"/>
        <text x="8" y="-45" fill="#38BDF8" font-size="8" font-family="sans-serif" text-anchor="middle">Q1</text>
      </g>
      <!-- Bar 2 -->
      <g style="transform-origin: 35px 0px; animation-delay: 0.3s;" class="pulse-chart">
        <rect x="25" y="-68" width="16" height="68" rx="3" fill="url(#barGrad2)"/>
        <text x="33" y="-73" fill="#A78BFA" font-size="8" font-family="sans-serif" text-anchor="middle">Q2</text>
      </g>
      <!-- Bar 3 -->
      <g style="transform-origin: 60px 0px; animation-delay: 0.6s;" class="pulse-chart">
        <rect x="50" y="-95" width="16" height="95" rx="3" fill="url(#barGrad3)"/>
        <text x="58" y="-100" fill="#34D399" font-size="8" font-family="sans-serif" text-anchor="middle">Q3</text>
      </g>
      <!-- Bar 4 -->
      <g style="transform-origin: 85px 0px; animation-delay: 0.9s;" class="pulse-chart">
        <rect x="75" y="-115" width="16" height="115" rx="3" fill="url(#barGrad1)"/>
        <text x="83" y="-120" fill="#38BDF8" font-size="8" font-family="sans-serif" text-anchor="middle">Q4</text>
      </g>
    </g>

    <!-- Spline Area & Trend Line Overlay -->
    <path d="M 130 150 Q 160 120 185 130 T 225 75 T 260 55 L 260 165 L 130 165 Z" fill="url(#areaGrad)"/>
    <path d="M 130 150 Q 160 120 185 130 T 225 75 T 260 55" fill="none" stroke="url(#chartLineGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pulsing Trend Data Points -->
    <circle cx="185" cy="130" r="3.5" fill="#38BDF8" class="pulse-dot"/>
    <circle cx="225" cy="75" r="3.5" fill="#C084FC" class="pulse-dot" style="animation-delay: 0.6s;"/>
    <circle cx="260" cy="55" r="4.5" fill="#EC4899" class="pulse-dot" style="animation-delay: 1.2s;"/>

    <!-- Small Metric Tag -->
    <g transform="translate(140, 42)">
      <rect width="80" height="22" rx="6" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(14, 165, 233, 0.4)" stroke-width="1"/>
      <text x="40" y="15" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">
        KPI: OPTIMAL
      </text>
    </g>
  </g>

  <!-- Donut Chart Floating Card (Right Lower) -->
  <g transform="translate(420, 260)" class="float-analytics" style="animation-delay: 2s;" filter="url(#chartShadow)">
    <rect width="180" height="100" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
    <!-- Donut Segments -->
    <g transform="translate(50, 50)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1E293B" stroke-width="10"/>
      <!-- Segment 1 (Positive) -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="10" stroke-dasharray="100 176" stroke-dashoffset="0"/>
      <!-- Segment 2 (Neutral) -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#38BDF8" stroke-width="10" stroke-dasharray="45 176" stroke-dashoffset="-100"/>
      <!-- Segment 3 (Analytics) -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#C084FC" stroke-width="10" stroke-dasharray="31 176" stroke-dashoffset="-145"/>
      <text x="0" y="4" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">78%</text>
    </g>
    <!-- Donut Legend -->
    <g transform="translate(100, 30)">
      <circle cx="0" cy="6" r="3" fill="#10B981"/>
      <text x="10" y="9" fill="#94A3B8" font-size="8" font-family="sans-serif">Sentiment</text>
      <circle cx="0" cy="22" r="3" fill="#38BDF8"/>
      <text x="10" y="25" fill="#94A3B8" font-size="8" font-family="sans-serif">Accuracy</text>
      <circle cx="0" cy="38" r="3" fill="#C084FC"/>
      <text x="10" y="41" fill="#94A3B8" font-size="8" font-family="sans-serif">Trends</text>
    </g>
  </g>

  <!-- ==================== DATA ANALYST CHARACTER ==================== -->
  <g transform="translate(180, 150)">
    <!-- Character Torso & Hoodie -->
    <path d="M -50 110 C -50 70 -35 50 0 50 C 35 50 50 70 50 110 L 45 190 L -45 190 Z" fill="url(#hoodieGrad2)"/>
    
    <!-- Hoodie V-neck & Drawstrings -->
    <path d="M -16 54 L 0 76 L 16 54 Z" fill="#1E1B4B"/>
    <polygon points="-8,54 0,66 8,54" fill="#38BDF8" opacity="0.8"/>
    <line x1="-6" y1="70" x2="-6" y2="88" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="6" y1="70" x2="6" y2="86" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-10" y="30" width="20" height="24" rx="5" fill="#EAA882"/>

    <!-- Head -->
    <g transform="translate(0, 0)">
      <!-- Ears -->
      <circle cx="-28" cy="5" r="8" fill="#EAA882"/>
      <circle cx="28" cy="5" r="8" fill="#EAA882"/>

      <!-- Face -->
      <path d="M -25 -15 C -25 -32 25 -32 25 -15 C 25 12 18 30 0 30 C -18 30 -25 12 -25 -15 Z" fill="url(#skinGrad2)"/>

      <!-- Glasses -->
      <rect x="-21" y="-4" width="18" height="14" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.8"/>
      <rect x="3" y="-4" width="18" height="14" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.8"/>
      <line x1="-3" y1="3" x2="3" y2="3" stroke="#38BDF8" stroke-width="1.8"/>

      <!-- Eyes & Highlights -->
      <circle cx="-12" cy="3" r="3" fill="#1E1B2E"/>
      <circle cx="-13" cy="2" r="1" fill="#FFFFFF"/>
      <circle cx="12" cy="3" r="3" fill="#1E1B2E"/>
      <circle cx="11" cy="2" r="1" fill="#FFFFFF"/>

      <!-- Eyebrows -->
      <path d="M -20 -8 Q -12 -12 -5 -8" fill="none" stroke="#2D283E" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 5 -8 Q 12 -12 20 -8" fill="none" stroke="#2D283E" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Nose & Smile -->
      <path d="M 0 7 Q 1 11 4 10" fill="none" stroke="#D98E68" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M -6 16 Q 0 22 6 16" fill="none" stroke="#B85C42" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Cheeks -->
      <ellipse cx="-16" cy="13" rx="3" ry="1.8" fill="#F87171" opacity="0.4"/>
      <ellipse cx="16" cy="13" rx="3" ry="1.8" fill="#F87171" opacity="0.4"/>

      <!-- Hair -->
      <path d="M -26 -14 C -26 -35 -12 -44 10 -42 C 22 -40 30 -28 28 -16 C 26 -20 18 -24 10 -23 C 0 -22 -10 -20 -16 -14 Z" fill="url(#hairGrad2)"/>
    </g>

    <!-- Right Arm: Gesturing toward the holographic charts -->
    <path d="M 35 90 Q 75 95 105 75" fill="none" stroke="#1E1B4B" stroke-width="14" stroke-linecap="round"/>
    <circle cx="108" cy="73" r="6" fill="#EAA882"/>
    <!-- Stylus / Holographic Beam in hand -->
    <line x1="106" y1="75" x2="135" y2="60" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" filter="url(#dataGlow)"/>

    <!-- Left Arm: Holding Digital Analytics Tablet -->
    <path d="M -35 90 Q -55 120 -25 140" fill="none" stroke="#1E1B4B" stroke-width="14" stroke-linecap="round"/>
    <!-- Tablet -->
    <g transform="translate(-40, 130) rotate(-10)">
      <rect x="-10" y="-5" width="45" height="32" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="-7" y="-2" width="39" height="26" rx="2" fill="#0F172A"/>
      <!-- Tiny chart on tablet -->
      <line x1="-3" y1="18" x2="2" y2="10" stroke="#10B981" stroke-width="1.5"/>
      <line x1="2" y1="10" x2="10" y2="14" stroke="#10B981" stroke-width="1.5"/>
      <line x1="10" y1="14" x2="20" y2="6" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="27" cy="11" r="5" fill="#EAA882"/>
    </g>
  </g>

  <!-- ==================== FLOATING ANALYTICS TOOLS ==================== -->

  <!-- Power BI Badge (Left) -->
  <g transform="translate(45, 110)" class="float-analytics" filter="url(#chartShadow)">
    <rect width="44" height="44" rx="10" fill="#1E293B" stroke="rgba(242, 200, 17, 0.4)" stroke-width="1.5"/>
    <!-- Power BI 3 bars -->
    <rect x="13" y="24" width="4" height="10" rx="1" fill="#F2C811"/>
    <rect x="20" y="18" width="4" height="16" rx="1" fill="#F2C811"/>
    <rect x="27" y="12" width="4" height="22" rx="1" fill="#F2C811"/>
  </g>

  <!-- Excel / Spreadsheet Badge (Left Lower) -->
  <g transform="translate(50, 240)" class="float-analytics" style="animation-delay: 1.2s;" filter="url(#chartShadow)">
    <rect width="44" height="44" rx="10" fill="#1E293B" stroke="rgba(16, 124, 65, 0.4)" stroke-width="1.5"/>
    <rect x="10" y="10" width="24" height="24" rx="3" fill="#107C41"/>
    <text x="22" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">X</text>
  </g>

  <!-- Qlik Analytics Spark (Top Center) -->
  <g transform="translate(260, 20)" class="float-analytics" style="animation-delay: 2.5s;" filter="url(#chartShadow)">
    <rect width="40" height="40" rx="10" fill="#1E293B" stroke="rgba(0, 152, 70, 0.4)" stroke-width="1.5"/>
    <circle cx="16" cy="20" r="5" fill="#009846"/>
    <circle cx="24" cy="20" r="3" fill="#009846" opacity="0.6"/>
  </g>

  <!-- Bottom Caption Pill -->
  <g transform="translate(320, 395)" text-anchor="middle">
    <rect x="-150" y="-12" width="300" height="24" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
    <text x="0" y="4" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      📊 <tspan fill="#38BDF8">Transforming Complex Data</tspan> into <tspan fill="#A78BFA">Actionable Intelligence</tspan>
    </text>
  </g>
</svg>
