<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="180">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>

    <linearGradient id="feedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="676" height="176" rx="14" fill="url(#cardBg2)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5"/>

  <!-- Left Icon Visual -->
  <g transform="translate(30, 40)">
    <rect width="64" height="64" rx="14" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
    <text x="32" y="42" font-size="28" text-anchor="middle">💬</text>
  </g>

  <!-- Project Details -->
  <g transform="translate(112, 38)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="165" height="20" rx="10" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
    <text x="82" y="14" fill="#D8B4FE" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
      SENTIMENT ANALYTICS APP
    </text>

    <!-- Title -->
    <text x="0" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
      Customer Feedback Analyzer
    </text>

    <!-- Description -->
    <text x="0" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">
      Interactive feedback management dashboard featuring sentiment classification, dynamic
    </text>
    <text x="0" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">
      visualizations with Chart.js, keyword tagging, multi-criteria filtering, and local persistence.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 104)">
      <!-- JavaScript Badge -->
      <rect x="0" y="0" width="85" height="20" rx="6" fill="#1E293B" stroke="rgba(247, 223, 30, 0.4)" stroke-width="1"/>
      <text x="42" y="14" fill="#FDE047" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">JavaScript</text>

      <!-- Chart.js Badge -->
      <rect x="93" y="0" width="75" height="20" rx="6" fill="#1E293B" stroke="rgba(255, 99, 132, 0.4)" stroke-width="1"/>
      <text x="130" y="14" fill="#FDA4AF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Chart.js</text>

      <!-- HTML5 Badge -->
      <rect x="176" y="0" width="65" height="20" rx="6" fill="#1E293B" stroke="rgba(227, 79, 38, 0.4)" stroke-width="1"/>
      <text x="208" y="14" fill="#FB923C" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HTML5</text>

      <!-- CSS3 Badge -->
      <rect x="249" y="0" width="60" height="20" rx="6" fill="#1E293B" stroke="rgba(21, 114, 182, 0.4)" stroke-width="1"/>
      <text x="279" y="14" fill="#60A5FA" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CSS3</text>

      <!-- Analytics Badge -->
      <rect x="317" y="0" width="125" height="20" rx="6" fill="#1E293B" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1"/>
      <text x="379" y="14" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sentiment Analysis</text>
    </g>
  </g>

  <!-- Right Action Pill -->
  <g transform="translate(640, 36)" text-anchor="end">
    <text x="0" y="0" fill="#C084FC" font-family="monospace" font-size="11" font-weight="bold">Explore Repo ↗</text>
  </g>
</svg>
